[package]
name = "daggercraft-toolbox"
version = "1.0.1"
description = "Fast, offline-first DM tools for tabletop campaigns."
authors = ["DaggerCraft"]
edition = "2021"

[lib]
name = "daggercraft_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
